[package]
name = "padcompat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Read-only Linux gamepad discovery and diagnostics"
readme = "README.md"
publish = false

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
udev = "0.9.3"
